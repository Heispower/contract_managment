{% extends "base.html" %}
{% from "macros.html" import field_error %}
{% block title %}修改密码{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>修改本人密码</h1>
  {{ field_error(errors) }}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>原密码<input type="password" name="old_password" required></label>
    <label>新密码<input type="password" name="new_password" minlength="6" required></label>
    <label>确认新密码<input type="password" name="new_password2" minlength="6" required></label>
    <div class="form-actions">
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</section>
{% endblock %}
