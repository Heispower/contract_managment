{% extends "base.html" %}
{% from "macros.html" import field_error %}
{% block title %}{{ '编辑汇率' if editing else '新增汇率' }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="panel-head">
    <h1>{{ '编辑汇率' if editing else '新增汇率' }}</h1>
    <a class="btn" href="{{ url_for('rates.index') }}">返回</a>
  </div>
  {{ field_error(errors) }}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>月份 <i>*</i><input name="month" value="{{ form.month }}" placeholder="YYYY-MM" required></label>
    <label>源币种<input value="USD" readonly></label>
    <label>目标币种<input value="CNY" readonly></label>
    <label>汇率 <i>*</i><input name="rate" value="{{ form.rate }}" inputmode="decimal" placeholder="保留 6 位小数" required></label>
    <label>生效日期 <i>*</i><input type="date" name="effective_date" value="{{ form.effective_date }}" required></label>
    <label>备注<textarea name="remark" rows="3" maxlength="200">{{ form.remark }}</textarea></label>
    <div class="form-actions">
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</section>
{% endblock %}
